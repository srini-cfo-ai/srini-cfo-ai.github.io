name: AI writer — weekly post

on:
  schedule:
    - cron: "0 7 * * 2"   # every Tuesday 07:00 UTC
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic (leave blank to take the next one from content/topics.yml)"
        required: false

permissions:
  contents: write
  pull-requests: write
  actions: write
  models: read

jobs:
  draft:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
      LLM_MODEL: ${{ vars.LLM_MODEL }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      # repo variable PUBLISH_MODE: "review" (default) = opens a pull request you approve with one click;
      #                             "auto" = publishes immediately with no human check.
      PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'review' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Draft the post
        id: d
        run: echo "file=$(python -m portal.draft "${{ inputs.topic }}" | tail -n1)" >> "$GITHUB_OUTPUT"
      - name: Publish or open for review
        run: |
          git config user.name "portal-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TITLE=$(grep -m1 '^title:' "${{ steps.d.outputs.file }}" | sed 's/^title: *//; s/^"//; s/"$//')
          if [ "$PUBLISH_MODE" = "auto" ]; then
            git add content state && git commit -m "post: $TITLE" && git push
            gh workflow run publish.yml --ref main
          else
            BR="draft/$(date +%Y%m%d-%H%M)"
            git checkout -b "$BR" && git add content state && git commit -m "post: $TITLE" && git push -u origin "$BR"
            gh pr create --title "New post: $TITLE" --body "AI-drafted post. Review the text in **Files changed**, edit if needed, then click **Merge** — it will go live on the site and every social channel automatically." --base main --head "$BR"
          fi
