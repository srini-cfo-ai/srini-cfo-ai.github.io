about: |
  I am a Chartered Accountant who builds finance functions that run on data and AI.
  My work sits where the CFO's agenda meets modern tooling: multi-entity MIS and
  board reporting, rolling forecasts, cash and treasury visibility, and the
  automation that removes manual spreadsheet effort from every one of them.

  I write here about practical AI for finance leaders — what works, what does not,
  and how to get from a 10-day close to a same-week board pack without losing control.

expertise:
