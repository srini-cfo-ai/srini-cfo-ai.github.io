about: |
  I am a Chartered Accountant (ICAEW and ICAI) with more than two decades in finance
  leadership across wind energy, aerospace and defence, fintech and diversified
  industrial groups. I have been a Regional CFO, a startup CFO and a Head of Finance.
  That has meant owning budgets of up to US$300 million, raising debt, equity and
  green-bond finance, leading ERP transformations and reporting to boards in the UK and India.

  Today I lead group-wide performance management for an international industrial holding
  group spanning manufacturing, FMCG, mining and forestry. Much of that work is now
  powered by AI: automated MIS and board packs, KPI dashboards, rolling cash forecasts
  and controls built into every run.

  Here I write about practical AI for CFOs and finance leaders: what works, what does
  not, and how to move from a ten-day close to a same-week board pack without losing control.

