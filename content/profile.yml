  - title: Board reporting & FP&A
    text: Board decks, variance commentary, unit-cost and AISC analysis, budget vs actual and rolling forecasts that leadership actually reads.
  - title: Finance transformation
    text: Target operating models, ERP-to-insight data flows and the change management that makes automation stick.
  - title: Group reporting & consolidation
    text: Multi-entity, multi-currency reporting across manufacturing, mining and FMCG businesses.
  - title: Cash & treasury forecasting
    text: Group cash forecasts, funding requirements and FX-aware reporting for shareholders and lenders.
  - title: Finance data & AI engineering
    text: SQL, Python, .NET and LLM agents applied to ledgers, trial balances and ERP exports — with controls auditors trust.

